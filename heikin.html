.sel button{min-height:84px;font-size:18px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.3}.sel button b{font-size:24px}.sel button.on{background:#3a6fd8;color:#fff}

ruby rt{font-size:.5em}

<body>
<div id="app">
  <header><span class="t" id="ht">平均</span><div id="dots"></div><span class="send" id="sendst"></span><button class="sm" id="endbtn" style="display:none">おわる</button></header>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<script id="data">
// =====================================================================
// ★ 先生が書きかえる場所 ①：送り先の設定
//   webhookUrl … Power Automate「HTTP 要求の受信時」のURL。入れると自動で先生に届く
//   formsUrl   … Forms の事前入力URL（__BAN__ などの記号入り）。入れると終了画面に「先生に送る」ボタンが出る
//   どちらも空でも動く（記録コードを児童が Teams に貼る）
// =====================================================================
const CONFIG = {
  unit: '平均',
  webhookUrl: '',
  formsUrl: '',
  variants: true,      // 類題（数値をかえた問題）を出すか。授業で使わないときは false
  autoSendEvery: true, // 1問ごとに自動で送る（false にすると終了時だけ）
  testFormat: 'mix'    // 単元末テストの出し方：'mix'（数を入れる問題と組み立て問題を交互）／'number'（全部数を入れる）／'build'（全部組み立て）
};

// ---------- 小さな道具 ----------
const sum = a => a.reduce((x, y) => x + y, 0);
const fx = x => parseFloat(x.toFixed(6));            // 0.1+0.2 のゴミを消す
const rnd = (x, k) => { const p = Math.pow(10, k); return Math.round(x * p + 1e-9) / p; };
const trunc = (x, k) => { const p = Math.pow(10, k); return Math.floor(x * p + 1e-9) / p; };
const near = (a, b, e) => Math.abs(a - b) < (e || 1e-6);
const fmt = x => String(fx(x));
const J = a => a.map(fmt).join('＋');
const R = (k, r) => '<ruby>' + k + '<rt>' + r + '</rt></ruby>';   // ふりがな
const RUBY_SS = R('四捨五入', 'ししゃごにゅう');
const RUBY_MILK = R('牛乳', 'ぎゅうにゅう');

// =====================================================================
// ★ 先生が書きかえる場所 ②：つまずき分類（id・名前・児童に見せる一言・練習にもどる先）
// =====================================================================
const MISC = {
  'm-count':   { code: 'C', name: '個数のまちがい',            msg: 'わる数は「いくつあるか」だよ。表の数を1つずつ数えてみよう。', pre: 'pre-table' },
  'm-zero':    { code: 'Z', name: '0をぬいてわった',            msg: '0のときも1回に数えるよ。0も入れて、個数を数えよう。' },
  'm-avg2':    { code: 'A', name: '平均と新しい数を2でわった',  msg: '平均は「全部をならした量」だよ。先に、もとの合計を出そう。' },
  'm-outlier': { code: 'O', name: 'とびぬけた数のあつかい',      msg: 'とびぬけた数を入れたままになっていないかな。' },
  'm-round':   { code: 'R', name: '四捨五入の位',               msg: 'どの位まで求めるのか、もう一度たしかめよう。', pre: 'pre-round' },
  'm-kari':    { code: 'K', name: '基準にもどしていない',        msg: 'それは「基準より上の部分」の平均だよ。基準の数をたそう。' },
  'm-reverse': { code: 'V', name: 'かけるとわるが反対',          msg: '全部の量は「平均×個数」だよ。わるのではなく、かけよう。' },
  'm-calc':    { code: 'L', name: '計算のまちがい',              msg: '式は合っているよ。計算をもう一度たしかめよう。', pre: 'pre-div' },
  'm-unit':    { code: 'U', name: '単位',                        msg: '単位をたしかめよう。何で答えるのかな。', pre: 'pre-unit' }
};

// =====================================================================
// ★ 先生が書きかえる場所 ③：図（考え方）の名前
//    各問題の reps に、おすすめ順に書く。画面に出るのは使えるもののうち先頭2つだけ
// =====================================================================
const REPS = {
  'r-block':   { code: 'b', name: 'ブロックをならす',     sub: '多い列から少ない列へ動かす' },
  'r-cup':     { code: 'c', name: 'コップの水を移す',     sub: '多いコップから少ないコップへ' },
  'r-bar':     { code: 'g', name: 'ぼうグラフと横線',     sub: '横線を動かして、でこぼこを同じにする' },
  'r-base':    { code: 'k', name: '基準より上を見る',     sub: '仮平均' },
  'r-line':    { code: 'l', name: '数直線で予想する',     sub: '平均はどのあたり？' },
  'r-tape':    { code: 't', name: 'テープ図',             sub: '平均が個数分ならぶと合計' },
  'r-formula': { code: 'f', name: '式',                   sub: '' },
  'r-words':   { code: 'w', name: '言葉でならべる',       sub: '' }
};

// =====================================================================
// ★ 先生が書きかえる場所 ④：もどって考える問題（下の学年の内容）
// =====================================================================
const PREREQ = {
  'pre-div':   { name: '小数になるわり算', items: [{ q: '483÷6＝？', a: 80.5 }, { q: '252÷4＝？', a: 63 }] },
  'pre-dec':   { name: '小数のたし算・かけ算', items: [{ q: '9.56＋9.61＋9.44＝？', a: 28.61 }, { q: '2.3×30＝？', a: 69 }] },
  'pre-round': { name: RUBY_SS, items: [{ q: '2.271 を 1/10 の位まで（1/100 の位で ' + RUBY_SS + '）', a: 2.3 }, { q: '9.536 を 1/100 の位まで', a: 9.54 }] },
  'pre-table': { name: '表の読み取り', table: { head: ['曜日', '月', '火', '水', '木', '金'], rows: [['人数(人)', 1, 3, 0, 2, 1]] },
                 items: [{ q: '表の数は、全部でいくつある？', a: 5 }, { q: '表の数を全部たすと？', a: 7 }] },
  'pre-unit':  { name: '単位のかんさん', items: [{ q: '11700mL は 何L？', a: 11.7 }, { q: '630cm は 何m？', a: 6.3 }] }
};

// ---------- 問題をつくる道具（ここから下は、ふつうは書きかえない） ----------
// sol … ヒントの1本道。{t:見出し, f:式, r:答え}。ヒントを押すたびに「式」→「その答えと次の式」→…→「答え」の順に1つずつ出る
function solAvg(d, k, lead) {
  const s = fx(sum(d)), n = d.length, ex = s / n;
  const L = [{ t: lead || '合計', f: J(d), r: s }];
  if (k == null) L.push({ t: '合計÷個数', f: fmt(s) + '÷' + n, r: fx(ex) });
  else {
    const tr = trunc(ex, k + 1);
    L.push({ t: '合計÷個数', f: fmt(s) + '÷' + n, r: tr, more: !near(tr, ex) });
    L.push({ t: RUBY_SS + 'する', f: fmt(tr) + (near(tr, ex) ? '' : '…') + ' を 1/' + Math.pow(10, k) + ' の位まで', r: rnd(ex, k) });
  }
  return L;
}
function miscAvg(d, k, extra) {
  const s = fx(sum(d)), n = d.length, a = s / n, ans = k == null ? fx(a) : rnd(a, k);
  const m = [];
  if (d.includes(0)) { const nz = d.filter(v => v !== 0); m.push({ id: 'm-zero', vals: [sum(nz) / nz.length] }); }
  if (extra) m.push(...extra);
  if (k != null) m.push({ id: 'm-round', vals: [rnd(a, k + 1), trunc(a, k), rnd(a, Math.max(k - 1, 0)), fx(a)] });
  m.push({ id: 'm-count', vals: [s / (n - 1), s / (n + 1)] });
  m.forEach(x => x.vals = x.vals.filter(v => !near(v, ans)));
  return m;
}
// 平均を求める小問
// expr … 「式をえらぶ」の正しい式。wrong … まちがいの式（つまずきから作る）。fig … 「図をえらぶ」の正しい図の種類
function avgWrong(d, all) {
  const n = d.length, w = [];
  if (all) w.push('(' + J(all) + ')÷' + all.length);
  if (d.includes(0)) { const nz = d.filter(v => v !== 0); w.push('(' + J(nz) + ')÷' + nz.length); }
  else w.push('(' + J(d) + ')÷' + (n - 1));
  w.push('(' + fmt(Math.min(...d)) + '＋' + fmt(Math.max(...d)) + ')÷2');
  w.push('(' + J(d) + ')×' + n);
  return w;
}
const avgPart = (q, d, unit, o) => Object.assign({ q, type: 'number', unit, answer: o && o.k != null ? rnd(sum(d) / d.length, o.k) : fx(sum(d) / d.length), round: o && o.k,
  sol: solAvg(d, o && o.k, o && o.lead), misc: miscAvg(d, o && o.k, o && o.extra), pre: o && o.k != null ? 'pre-round' : 'pre-div',
  expr: '(' + J(d) + ')÷' + d.length, wrong: avgWrong(d, o && o.all), fig: 'level' }, o && o.more);
// 平均×個数 の小問
const mulPart = (q, a, n, unit, label) => ({ q, type: 'number', unit, answer: fx(a * n), sol: [{ t: label || '全部（平均×個数）', f: fmt(a) + '×' + n, r: fx(a * n) }],
  misc: [{ id: 'm-reverse', vals: [a / n, n / a] }], pre: 'pre-dec', tape: { avg: a, n, dir: 'total' }, reps: ['r-tape'],
  expr: fmt(a) + '×' + n, wrong: [fmt(a) + '÷' + n, fmt(a) + '＋' + n, n + '÷' + fmt(a)], fig: 'repeat' });
const tbl = (head, row) => ({ head, rows: [row] });
const circ = n => Array.from({ length: n }, (_, i) => '①②③④⑤⑥⑦⑧⑨⑩'[i]);

// 問題の「族」：同じ形で数値だけちがう問題を3つ（本問＋類題2つ）つくる
//   sets[0]=本問 sets[1]=類題① sets[2]=類題② sets[3]=テスト用（なければ類題②の数）
//   easy … 答えまでヒントを見たときに出す「やさしい数」の練習（計算がかんたんな数）
//   pic  … 教科書と同じような絵（PICS の名前）
const EXTRA = [];
function fam(spec) {
  const mk = (d, i, suf) => Object.assign({ id: spec.id + suf, base: spec.id, vi: i, page: spec.page, title: spec.title, reps: spec.reps, pic: spec.pic }, spec.make(d, i));
  if (spec.easy) EXTRA.push(mk(spec.easy, 3, 'e'));
  EXTRA.push(mk(spec.sets[3] || spec.sets[2], 4, 't'));
  return spec.sets.slice(0, 3).map((d, i) => mk(d, i, ['', 'b', 'c'][i]));
}

// =====================================================================
// ★ 先生が書きかえる場所 ⑤：問題データ。sets の数値をかえれば答え・ヒントは自動で計算される
//    （本問は教科書そのまま。2つ目・3つ目が類題）
//    reps … 図のおすすめ順（先頭2つが画面に出る）
//    choice の hint … ヒントで出す一言（2回目のヒントで答えが出る）
// =====================================================================
const FAMILIES = [
  fam({ id: 'p132-1', page: 'p.132 1', title: 'オレンジのジュース', pic: 'juice', easy: [80, 90, 70, 80, 80], sets: [[80, 100, 75, 80, 65], [90, 70, 85, 60, 95], [86, 92, 75, 80, 70]],
    reps: ['r-cup', 'r-bar'],
    make: d => ({ text: 'オレンジを' + d.length + '個しぼったら、それぞれ次の量のジュースがとれました。オレンジ1個からとれるジュースの量は、何mLとみればよいでしょうか。',

const UNIT_OPTS = { mL: ['mL', 'L', 'g'], L: ['L', 'mL', 'kg'], g: ['g', 'kg', 'mL'], kg: ['kg', 'g', 'L'], '秒': ['秒', '分', 'm'], '分': ['分', '秒', '時間'],

  mid2: '2つの数のまん中をもとめる', addnew: 'もとの平均が何こ分もあるところに、新しい1こをたしてならす' };

function evalExpr(e) { try { return Function('return ' + e.replace(/＋/g, '+').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-'))(); } catch (x) { return NaN; } }

function seedOf(str) { let h = 7; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 100000; return h + 1; }
function decOf(x) { return (String(fx(x)).split('.')[1] || '').length; }

  st.push({ kind: 'expr', q: '正しい式はどれ？', options: shuffle(ex.map(e => ({ t: e, ok: e === part.expr })), seed + 1) });

  const us = UNIT_OPTS[part.unit] || [part.unit];
  st.push({ kind: 'unit', q: '答えの単位はどれ？', options: shuffle(us.map(u => ({ t: u, ok: u === part.unit })), seed + 3) });

  if (isTest()) {

    cur.bstep++; if (cur.bstep < st.length) return renderBuild();
    return testRecord(cur.bbits.every(b => b), { b: cur.bbits.join('') });
  }
  if (o.ok) {
    cur.bbits.push(cur.btries === 0 && cur.hint <= cur.bstep ? 1 : 0); cur.bpick.push(o.t); cur.btries = 0; cur.bstep++;

}

// ---------- ヒント：おすすめの1本道（押すたびに1つずつ出る。えらぶことはない） ----------
// number：式 → その答えと次の式 → … → 答え　／　choice：考えるための一言 → 答え　／　build：いまの段の答えに印
function hintMax(part) { const f = curFmt(); return f === 'build' ? bsteps().length : part.type === 'choice' ? 2 : part.sol.length + 1; }
function hintNextLabel(part) {
  const L = cur.hint, M = hintMax(part), f = curFmt();
  if (f === 'build') return cur.hint > cur.bstep ? null : 'この「' + BNAME[bsteps()[cur.bstep].kind] + '」の答えを見る';
  if (L >= M) return null;
  if (f === 'choice') return L === 0 ? '考え方を見る' : '答えを見る';
  if (L === 0) return '式を見る';
  return L === M - 1 ? '答えを見る' : '計算の答えを見る';
}
function hintNext() {
  const part = curPart(), f = curFmt();
  if (f === 'build') { if (cur.hint <= cur.bstep) { cur.hint = cur.bstep + 1; renderBuild(); renderFoot(); } return; }
  if (cur.hint >= hintMax(part)) return;
  cur.hint++;
  if (f === 'number' && cur.hint >= 2) cur.stuck = part.sol[cur.hint - 2].t;
  renderHint(); renderFoot();
  if (f === 'choice' && cur.hint >= 2) renderInput();
  const hc = $('#hintcard'); if (hc) hc.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function renderHint() {
  const part = curPart(), L = cur.hint, el = $('#hintcard'), f = curFmt();

  let h = '<div class="hcard"><div class="hh">💡 ヒント</div>';
  if (f === 'choice') {
    h += '<div class="hl">' + part.hint + '</div>';
    if (L >= 2) { const i = part.options.findIndex(o => o.ok); h += '<div class="hl">答えは <b>' + '①②③④⑤'[i] + ' ' + part.options[i].t + '</b></div>'; }
  } else {
    part.sol.forEach((s, i) => {
      if (L < i + 1) return;
      const showR = L >= i + 2, last = i === part.sol.length - 1;
      h += '<div class="hl"><span class="ht">' + (part.sol.length > 1 ? '①②③④'[i] + ' ' : '') + s.t + '</span><span class="hf">' + s.f + '</span>' +
        (showR ? '<span class="hr">＝ ' + fmt(s.r) + (s.more ? '…' : '') + (last ? ' ' + part.unit : '') + '</span>' : '<span class="hq">＝ ？</span>') + '</div>';
    });
    if (L === 1) h += '<div class="hn">計算して、答えを入れてみよう。計算がむずかしいときは、もう一度ヒントをおしてね。</div>';
    else if (L <= part.sol.length) h += '<div class="hn">つぎの式も計算してみよう。</div>';
    else h += '<div class="hn">答えをテンキーで入れて「できた」をおそう。</div>';
  }

}

// ---------- 判定 ----------
// 意味のつまずき（図で見るのがおすすめ）と、計算のつまずき（式・計算の答えがおすすめ）を分ける
const CONCEPT = ['m-avg2', 'm-count', 'm-zero', 'm-outlier', 'm-kari', 'm-reverse'];
function isAns(v, ans) { return near(v, ans, 1e-6); }
function detectMisc(v, part) {
  for (const m of (part.misc || [])) { if (m.vals.some(x => matchVal(v, x))) return m.id; }
  return null;
}
function submit() {
  const part = curPart();
  const v = parseNum(input);
  if (v == null) return toast('数を入れてから「できた」をおしてね');
  if (isTest()) return testRecord(isAns(v, part.answer) || (part.alsoOk || []).some(o => isAns(v, o.value)), { v, misc: isAns(v, part.answer) ? null : detectMisc(v, part) });
  if (isAns(v, part.answer)) return correct();
  const alt = (part.alsoOk || []).find(o => isAns(v, o.value));
  if (alt) { showMsg(alt.note, 'ok'); return setTimeout(correct, 2500); }
  cur.attempts++; cur.wrong.push(v); input = '';
  const mid = detectMisc(v, part), reps = availableReps(curP(), part);
  let t, figBtn = '';
  if (mid && !cur.misc.includes(mid)) {
    cur.misc.push(mid); t = 'ここで考えよう：' + MISC[mid].msg;
    if (CONCEPT.includes(mid) && reps.length) figBtn = '<br><button class="sm figrec" id="gofig">' + FIG_ICON + ' ' + REPS[reps[0]].name + 'で見てみよう</button>';
  }
  else if (cur.hint < hintMax(part)) { hintNext(); t = 'ヒントを見て、もう一度やってみよう。'; }
  else t = 'ヒントの答えを、そのまま入れてみよう。';
  // 計算のつまずきが見えたときだけ、練習へもどる道を出す（自動では行かない）
  const pre = mid ? MISC[mid].pre : (cur.hint >= 1 ? part.pre : null);
  let preBtn = '';
  if (!figBtn && pre && PREREQ[pre] && !cur.preOffered) { cur.preOffered = true; preBtn = '<br><button class="sm pre" id="gopre">' + PREREQ[pre].name + ' のれんしゅうをする</button>'; }
  showMsg(t + figBtn + preBtn, '', 'think', 'もう一度やってみよう。');
  on('#gopre', () => runPrereq(pre)); on('#gofig', () => openReps(reps[0]));
  renderInput(); markDirty();
}
function choose(i) {
  const part = curPart(), o = part.options[i];
  if (isTest()) return testRecord(!!o.ok, { v: i + 1, misc: o.ok ? null : o.misc });
  if (o.ok) { if (part.tag === 'zero' && cur.attempts === 0) earn('zero'); return correct(); }
  cur.attempts++; cur.wrong.push(i + 1);
  if (o.misc && !cur.misc.includes(o.misc)) cur.misc.push(o.misc);
  if (cur.attempts >= 2 && cur.hint < hintMax(part)) hintNext();
  showMsg('ここで考えよう：' + (o.msg || part.hint), '', 'think', 'もう一度えらんでみよう。');

}
function correct() {
  const first = cur.attempts === 0 && cur.hint === 0 && cur.reps.length === 0 && cur.pre.length === 0;
  finishPart(true, first);
}
function finishPart(ok, first) {
  const P = curP(), e = curE(), k = key(e, S.pt), sawAns = cur.hint >= hintMax(curPart());
  S.items[k] = { ok: ok ? 1 : 0, first: first ? 1 : 0, hint: cur.hint, hmax: hintMax(curPart()), reps: cur.reps, misc: cur.misc, stuck: cur.stuck, pre: cur.pre, sec: Math.round((Date.now() - cur.t0) / 1000), wrong: cur.wrong, b: cur.bbits.join('') };
  if (first) earn('first');
  // やさしい数の練習で、答えを見ずにできたら、もとの問題も「練習でできた」にする
  if (P.vi === 3 && S.origin[e] && !sawAns && S.items[S.origin[e]]) S.items[S.origin[e]].redeem = 1;
  // 答えまで見てできた → つぎに「やさしい数」で同じ形の問題を1つ入れる
  let more = '';
  const ez = P.base + 'e', ee = ez + '@' + S.pt;
  if (sawAns && P.vi !== 3 && PBY[ez] && !S.queue.slice(S.pi + 1).includes(ee)) { S.queue.splice(S.pi + 1, 0, ee); S.origin[ee] = k; more = '<small>つぎは、やさしい数で もう1回やってみよう</small>'; }
  checkStreak(); checkRepsTitle();
  S.dirty = true; save(); scheduleSend();
  const f = document.createElement('div'); f.className = 'flash'; f.innerHTML = '正解！' + charSVG('happy') + (more || (first ? '' : '<small>ヒントや図を使ってできたね</small>')); document.body.appendChild(f);
  setTimeout(() => { f.remove(); nextPart(); }, more ? 1800 : 900);
}
// やさしい数の問題は、いまの問題（小問すべて）が終わってから出す
function nextPart() {
  input = '';
  const e = curE(), ps = qparts(e), i = ps.indexOf(S.pt);
  if (i + 1 < ps.length) S.pt = ps[i + 1];

}
// テスト：答えを記録して、正誤は見せずに次へ
function testRecord(ok, extra) {
  const e = curE(), k = key(e, S.pt);
  S.items[k] = Object.assign({ ok: ok ? 1 : 0, first: ok ? 1 : 0, test: 1, hint: 0, hmax: 0, reps: [], misc: extra.misc ? [extra.misc] : [], stuck: null, pre: [], sec: Math.round((Date.now() - cur.t0) / 1000), wrong: ok ? [] : [extra.v] }, extra.b ? { b: extra.b } : {});
  S.dirty = true; save(); scheduleSend();
  $('#main').style.opacity = .3; setTimeout(() => { $('#main').style.opacity = 1; nextPart(); }, 250);

// ---------- 称号 ----------
const TITLES = { first: 'はじめの一歩（1回めで正解）', streak3: '自力の3れん（ヒントなしで3問つづけて）', reps2: '見方いろいろ（図を2しゅるい使った）', back: 'もどってきた（前の学年の練習から帰ってきた）', zero: '0もなかま（0を入れる判断ができた）', redo: 'やりなおし名人（やさしい数で自分でできた）', all: 'ならしの達人（今日の問題を全部やった）' };
function earn(id) { if (isTest() || S.titles.includes(id)) return; S.titles.push(id); toast('しょうごう「' + TITLES[id] + '」'); }
function checkStreak() { const vals = Object.values(S.items); let n = 0; for (let i = vals.length - 1; i >= 0 && vals[i].ok && vals[i].first; i--) n++; if (n >= 3) earn('streak3'); if (vals.some(r => r.redeem)) earn('redo'); }
function checkRepsTitle() { const s = new Set(); Object.values(S.items).forEach(r => r.reps.forEach(x => s.add(x))); if (cur) cur.reps.forEach(x => s.add(x)); if (s.size >= 2) earn('reps2'); }

// ---------- もどって考える（遡り）：児童がボタンを押したときだけ ----------
function runPrereq(preId) {
  const pre = PREREQ[preId]; let i = 0; const results = [];
  const ov = document.createElement('div'); ov.className = 'ovl'; document.body.appendChild(ov);
  const draw = () => {
    input = '';
    const it = pre.items[i];
    ov.innerHTML = '<div class="ohead">れんしゅう：' + pre.name + '（' + (i + 1) + '／' + pre.items.length + '）</div><div class="body">' + chr('think', 'ここができれば、もとの問題もできるよ。') +
      tableHTML(pre.table) + '<div class="q">' + it.q + '</div><div id="pmsg"></div><div class="ans">答え <span class="box cur" id="pinp"></span></div>' + tenkeyHTML() + '</div>' +
      '<div class="bar"><button id="pquit">もとの問題にもどる</button><button class="ok" id="pok">できた</button></div>';
    ov.querySelectorAll('.tenkey button').forEach(b => b.addEventListener('click', () => { const k = b.dataset.k; if (k === '⌫') input = input.slice(0, -1); else if (k === '.') { if (!input.includes('.')) input = (input || '0') + '.'; } else if (input.length < 8) input += k; ov.querySelector('#pinp').textContent = input; }));
    ov.querySelector('#pquit').addEventListener('click', back);

      ov.querySelector('.bar').innerHTML = '<button class="pri" id="pnext">' + (i + 1 < pre.items.length ? 'つぎへ' : 'もとの問題にもどる') + '</button>';
      ov.querySelector('#pnext').addEventListener('click', () => { i++; if (i < pre.items.length) draw(); else back(); });

// ---------- 図で考える：おすすめの2つだけ ----------
function availableReps(P, part) {
  return (part.reps || P.reps).filter(id => {
    const d = part.wd || P.d;
    if (id === 'r-block') return blockUnit(d) != null;
    if (id === 'r-cup') return d.length >= 2 && d.length <= 8;

// direct … おすすめの図を1つ、えらばずにすぐ開く
function openReps(direct) {

  const close = () => { ov.remove(); input = ''; renderInput(); $('#chr').innerHTML = chr('normal', '図で考えたことを使って、答えを入れてみよう。'); };

  };
  const show = id => {
    if (!cur.reps.includes(id)) cur.reps.push(id); checkRepsTitle(); markDirty();
    ov.innerHTML = '<div class="ohead">' + FIG_ICON + ' ' + REPS[id].name + '</div><div class="body"><div class="q" style="font-size:22px">' + part.q + '</div><div id="wbody"></div></div><div class="bar">' +
      (reps.length > 1 ? '<button id="rback">もう1つの図</button>' : '') + '<button class="pri" id="rclose">問題にもどる</button></div>';
    const rb = ov.querySelector('#rback'); if (rb) rb.addEventListener('click', () => show(reps.find(r => r !== id)));

// ---------- おわり・記録・送信 ----------
const allKeys = () => S.queue.flatMap(e => qparts(e).map(t => [e, t]));
function finish() {

  save(); sendNow(false); renderEnd();
}
function recordJSON() {

}
function summary() {
  const vals = Object.values(S.items); const ok = vals.filter(r => r.ok).length, first = vals.filter(r => r.first).length;
  const hint = [0, 0, 0, 0]; let rep = 0, pre = 0; const reps = {}, misc = {};
  vals.forEach(r => { if (r.hint) hint[r.hint >= r.hmax ? 3 : r.hint === 1 ? 1 : 2]++; if (r.reps.length) rep++; pre += r.pre.length; r.reps.forEach(x => reps[x] = (reps[x] || 0) + 1); r.misc.forEach(x => misc[x] = (misc[x] || 0) + 1); });
  return { mon: vals.length, seikai: (isTest() ? 'テスト ' : '') + ok + '/' + vals.length + (isTest() ? '' : '(1回目' + first + ')'), hint: '式:' + hint[1] + ' 途中の答え:' + hint[2] + ' 答えまで:' + hint[3] + ' 図:' + rep + ' 遡り:' + pre,
    hyogen: Object.keys(reps).map(k => k + ':' + reps[k]).join(' ') || 'なし', tsumazuki: Object.keys(misc).map(k => k + ':' + misc[k]).join(' ') || 'なし' };
}
// 記録コード： H5|番号|セッション|問題:結果/h段階/r表現/mつまずき/s答えを見た式/p遡り/b組み立て/e練習でできた/t秒;...
//   結果 1=1回めで正解 2=ヒントなどで正解 0=未完（テストでは 1=正解 0=まちがい）
function recordCode() {
  const parts = allKeys().map(([e, t]) => {
    const r = S.items[key(e, t)]; const k = qid(e) + (t ? '.' + (t + 1) : '');

    let s = k + ':' + (r.test ? (r.ok ? '1' : '0') : r.first ? '1' : '2');
    if (r.hint) s += '/h' + r.hint + (r.hint >= r.hmax ? 'x' : '');
    if (r.reps.length) s += '/r' + r.reps.map(x => REPS[x].code).join('');

let sendTimer = null;

window.addEventListener('pagehide', () => { if (S && S.dirty && CONFIG.webhookUrl) sendNow(true); });

    S.ban + '番さん、今日は ' + vals.length + ' 問やって、' + ok + ' 問できたね。' + (first ? '（1回めで正解 ' + first + ' 問）' : ''));

  h += '<h2>' + (isTest() ? 'テストのけっか' : 'できた地図') + '</h2><div class="map">' + allKeys().map(([e, t]) => { const r = S.items[key(e, t)]; const P = PBY[qid(e)];

      msg.innerHTML = '<div class="msg ok">ぴったり同じになったね！ 1つ分は <b>' + fmt(rnd(avg, 3)) + (near(avg, rnd(avg, 3)) ? '' : '…') + U + '</b>。これが平均だよ。' +
        (nonInt ? '<br>' + Math.floor(avg) + U + 'でも' + Math.ceil(avg) + U + 'でもなく、その間の ' + fmt(rnd(avg, 3)) + U + ' だよ。' + (skin === 'block' ? '（ブロックを小さく切って分けたと考えるよ）' : '') : '') +
        '<br>計算でたしかめると　' + fmt(total) + '÷' + n + '＝' + fmt(rnd(avg, 3)) + '</div>';
    } else if (allEq()) {
      msg.innerHTML = '<div class="msg ok">ならせた！ 全部 <b>' + fmt(rnd(avg, 3)) + U + '</b>。これが平均だよ。<br>計算でたしかめると　' + fmt(total) + '÷' + n + '＝' + fmt(rnd(avg, 3)) + '</div>';
    } else if (close()) {
      msg.innerHTML = '<div class="msg info">' + (skin === 'cup' ? 'もうほとんど同じ！ これ以上 ' + step + U + 'ずつでは同じにならないね。' : 'ブロックが少しあまって、ぴったりにならないね。') +
        '<br><button class="sm ok" id="lvexact">' + (skin === 'cup' ? 'のこりも同じに分ける' : 'あまりを切って分ける') + '</button></div>';
      msg.querySelector('#lvexact').addEventListener('click', () => { exact = true; vals = vals.map(() => avg); draw(); });
    } else msg.innerHTML = '<div class="note">動かした回数：' + moves + ' 回</div>';
    tools.querySelector('#lvauto').disabled = exact || allEq();
  }
  const colAt = x => Math.max(0, Math.min(n - 1, Math.floor(x / colW)));
  svg.addEventListener('pointerdown', ev => {
    if (exact || timer) return; const p = ptPos(svg, ev); const i = colAt(p.x); if (vals[i] <= 1e-9) return;
    drag = { from: i, x: p.x, y: p.y, moved: false }; svg.setPointerCapture(ev.pointerId); draw(); ev.preventDefault();
  });
  svg.addEventListener('pointermove', ev => { if (!drag) return; const p = ptPos(svg, ev); drag.x = p.x; drag.y = p.y; drag.moved = true; draw(); });
  svg.addEventListener('pointerup', ev => {
    if (!drag) return; const p = ptPos(svg, ev); const j = colAt(p.x);
    if (j !== drag.from) { const a = Math.min(step, vals[drag.from]); vals[drag.from] = fx(vals[drag.from] - a); vals[j] = fx(vals[j] + a); moves++; }
    drag = null; draw();
  });
  svg.addEventListener('pointercancel', () => { drag = null; draw(); });
  host.querySelectorAll('[data-s]').forEach(b => {
    b.classList.toggle('on', +b.dataset.s === step);
    b.addEventListener('click', () => { step = +b.dataset.s; host.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', +x.dataset.s === step)); draw(); });
  });
  tools.querySelector('#lvreset').addEventListener('click', () => { clearInterval(timer); timer = null; vals = init.slice(); exact = false; moves = 0; draw(); });
  tools.querySelector('#lvauto').addEventListener('click', () => {
    if (timer) return;
    timer = setInterval(() => {
      if (!document.body.contains(svg)) { clearInterval(timer); timer = null; return; }
      if (allEq() || close()) { clearInterval(timer); timer = null; if (!allEq()) { exact = true; vals = vals.map(() => avg); } draw(); return; }
      let i = 0, j = 0; vals.forEach((v, k) => { if (v > vals[i]) i = k; if (v < vals[j]) j = k; });
      vals[i] = fx(vals[i] - step); vals[j] = fx(vals[j] + step); moves++; draw();
    }, 400);
  });
  draw();
}
WIDGETS['r-block'] = (h, c) => levelWidget(h, c, 'block');
WIDGETS['r-cup'] = (h, c) => levelWidget(h, c, 'cup');

// ---- ぼうグラフと横線 ----
WIDGETS['r-bar'] = function (host, ctx) {
  const d = ctx.d, n = d.length, mx = Math.max(...d) * 1.15, W = 760, H = 380, left = 70, top = 20, gh = 290, colW = (W - left - 20) / n;
  const k = decimalsOf(d) + 1, avg = sum(d) / n;
  host.innerHTML = '<div class="note">横線を上下に動かして、「線より上の分」と「線より下の分」が同じになる所をさがそう。</div><div id="brmsg"></div>';
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'w' }); host.appendChild(svg);
  const y = v => top + gh - v / mx * gh, val = yy => (top + gh - yy) / gh * mx;
  let L = rnd((Math.min(...d) + Math.max(...d)) / 2, k) + 0.0; let found = false;
  function draw() {
    svg.innerHTML = '';
    svg.appendChild(svgEl('line', { x1: left, y1: top, x2: left, y2: top + gh, stroke: '#333', 'stroke-width': 2 }));
    svg.appendChild(svgEl('line', { x1: left, y1: top + gh, x2: W - 10, y2: top + gh, stroke: '#333', 'stroke-width': 2 }));
    d.forEach((v, i) => {
      const x = left + colW * i + colW * 0.2, w = colW * 0.6;
      svg.appendChild(svgEl('rect', { x, y: y(v), width: w, height: top + gh - y(v), fill: '#bcd0f5' }));
      if (v > L) svg.appendChild(svgEl('rect', { x, y: y(v), width: w, height: y(L) - y(v), fill: '#e8891d', opacity: .8 }));
      if (v < L) svg.appendChild(svgEl('rect', { x, y: y(v), width: w, height: y(v) - y(L), fill: 'none', stroke: '#e8891d', 'stroke-width': 2, 'stroke-dasharray': '4 3', transform: 'translate(0,' + (-(y(v) - y(L))) + ')' }));
      svg.appendChild(svgEl('text', { x: x + w / 2, y: top + gh + 22, 'text-anchor': 'middle', 'font-size': 17 }, ctx.labels[i]));
      svg.appendChild(svgEl('text', { x: x + w / 2, y: y(v) - 6, 'text-anchor': 'middle', 'font-size': 17 }, fmt(v)));
    });
    svg.appendChild(svgEl('line', { x1: left - 10, y1: y(L), x2: W - 10, y2: y(L), stroke: found ? '#2e9e5b' : '#e8891d', 'stroke-width': 4 }));
    svg.appendChild(svgEl('text', { x: left - 12, y: y(L) + 7, 'text-anchor': 'end', 'font-size': 20, fill: found ? '#2e9e5b' : '#e8891d', 'font-weight': 'bold' }, fmt(L)));
    const above = fx(sum(d.map(v => Math.max(v - L, 0)))), below = fx(sum(d.map(v => Math.max(L - v, 0))));
    host.querySelector('#brmsg').innerHTML = found ? '<div class="msg ok">上と下がぴったり同じ！ この線の高さ ' + fmt(L) + ctx.unit + ' が平均だよ。</div>' :
      '<div class="row">線より上の分：<b>' + fmt(above) + '</b>　線より下の分：<b>' + fmt(below) + '</b>　' + (above > below ? '→ 線をもう少し上へ' : '→ 線をもう少し下へ') + '</div>';
  }
  const move = ev => { const p = ptPos(svg, ev); let v = rnd(Math.max(0, Math.min(mx, val(p.y))), k); if (Math.abs(v - avg) < mx * 0.02) { v = fx(avg); found = true; } else found = false; L = v; draw(); };
  svg.addEventListener('pointerdown', ev => { svg.setPointerCapture(ev.pointerId); move(ev); ev.preventDefault(); });
  svg.addEventListener('pointermove', ev => { if (ev.buttons || ev.pressure) move(ev); });
  draw();
};

// ---- 仮平均（基準より上を見る） ----
WIDGETS['r-base'] = function (host, ctx) {
  const d = ctx.d, n = d.length, W = 760, H = 380, left = 80, top = 20, gh = 290, colW = (W - left - 20) / n;
  const mn = Math.min(...d), mx = Math.max(...d);
  const cands = [...new Set([ctx.base - 100, ctx.base - 50, ctx.base, Math.floor(mn / 10) * 10])].filter(b => b > 0 && b <= mn).sort((a, b) => a - b);
  let base = null, leveled = false;
  host.innerHTML = '<div class="note">基準にする数をえらぶと、基準より上の部分だけが見えるよ。</div><div class="cards" id="bc">' + cands.map(b => '<button data-b="' + b + '">基準 ' + b + '</button>').join('') + '</div><div id="bmsg"></div>';
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'w' }); host.appendChild(svg);
  function draw() {
    svg.innerHTML = '';
    const lo = base == null ? 0 : base, hi = base == null ? mx * 1.1 : lo + (mx - lo) * 1.3;
    const y = v => top + gh - (v - lo) / (hi - lo) * gh;
    svg.appendChild(svgEl('line', { x1: left, y1: top, x2: left, y2: top + gh, stroke: '#333', 'stroke-width': 2 }));
    svg.appendChild(svgEl('line', { x1: left, y1: top + gh, x2: W - 10, y2: top + gh, stroke: '#333', 'stroke-width': 2 }));
    svg.appendChild(svgEl('text', { x: left - 8, y: top + gh + 6, 'text-anchor': 'end', 'font-size': 18 }, String(lo)));
    if (base != null) svg.appendChild(svgEl('text', { x: left - 8, y: top + gh + 30, 'text-anchor': 'end', 'font-size': 16, fill: '#e8891d' }, '基準'));
    const diffs = d.map(v => v - (base == null ? 0 : base)); const da = sum(diffs) / n;
    d.forEach((v, i) => {
      const x = left + colW * i + colW * 0.2, w = colW * 0.6;
      svg.appendChild(svgEl('rect', { x, y: y(v), width: w, height: top + gh - y(v), fill: base == null ? '#bcd0f5' : '#8fd19e' }));
      svg.appendChild(svgEl('text', { x: x + w / 2, y: top + gh + 22, 'text-anchor': 'middle', 'font-size': 17 }, ctx.labels[i]));
      svg.appendChild(svgEl('text', { x: x + w / 2, y: y(v) - 6, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 'bold' }, base == null ? fmt(v) : '+' + fmt(diffs[i])));
    });
    if (leveled) { svg.appendChild(svgEl('line', { x1: left - 10, y1: y(lo + da), x2: W - 10, y2: y(lo + da), stroke: '#2e9e5b', 'stroke-width': 4 })); svg.appendChild(svgEl('text', { x: W - 12, y: y(lo + da) - 8, 'text-anchor': 'end', 'font-size': 20, fill: '#2e9e5b', 'font-weight': 'bold' }, '上の部分をならすと +' + fmt(da))); }
    host.querySelector('#bmsg').innerHTML = base == null ? '' : leveled ? '<div class="msg ok">上の部分の平均は ' + fmt(da) + '。平均＝基準 ' + base + '＋' + fmt(da) + ' だね。</div>' :
      '<div class="msg info">上の部分：' + diffs.map(fmt).join('、') + '　<button class="sm" id="lv">上の部分をならす</button></div>';
    const lv = host.querySelector('#lv'); if (lv) lv.addEventListener('click', () => { leveled = true; draw(); });
  }
  host.querySelectorAll('#bc button').forEach(b => b.addEventListener('click', () => { base = +b.dataset.b; leveled = false; host.querySelectorAll('#bc button').forEach(x => x.classList.toggle('pri', x === b)); draw(); }));
  draw();
};

// ---- 数直線で予想 ----
WIDGETS['r-line'] = function (host, ctx) {
  const d = ctx.d, W = 760, H = 200, left = 40, right = W - 40, ly = 110;
  const lo = Math.floor(Math.min(...d)), hi = Math.ceil(Math.max(...d)) + (Math.ceil(Math.max(...d)) === Math.max(...d) ? 1 : 0);
  const k = decimalsOf(d) + 1, avg = sum(d) / d.length;
  let guess = null, revealed = false;
  host.innerHTML = '<div class="note">数直線をタップして、平均がありそうな所に印をつけよう。</div><div id="lmsg"></div>';
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'w' }); host.appendChild(svg);
  const x = v => left + (v - lo) / (hi - lo) * (right - left);
  function draw() {
    svg.innerHTML = '';
    svg.appendChild(svgEl('line', { x1: left, y1: ly, x2: right, y2: ly, stroke: '#333', 'stroke-width': 3 }));
    const step = (hi - lo) <= 10 ? 1 : Math.ceil((hi - lo) / 10);
    for (let v = lo; v <= hi; v += step) { svg.appendChild(svgEl('line', { x1: x(v), y1: ly - 10, x2: x(v), y2: ly + 10, stroke: '#333', 'stroke-width': 2 })); svg.appendChild(svgEl('text', { x: x(v), y: ly + 34, 'text-anchor': 'middle', 'font-size': 18 }, String(v))); }
    d.forEach((v, i) => { svg.appendChild(svgEl('circle', { cx: x(v), cy: ly - 30, r: 9, fill: '#bcd0f5', stroke: '#3a6fd8', 'stroke-width': 2 })); svg.appendChild(svgEl('text', { x: x(v), y: ly - 46, 'text-anchor': 'middle', 'font-size': 15 }, fmt(v))); });
    if (revealed) { svg.appendChild(svgEl('line', { x1: x(avg), y1: ly - 60, x2: x(avg), y2: ly + 10, stroke: '#2e9e5b', 'stroke-width': 4 })); svg.appendChild(svgEl('text', { x: x(avg), y: ly - 66, 'text-anchor': 'middle', 'font-size': 18, fill: '#2e9e5b', 'font-weight': 'bold' }, '平均 ' + fmt(rnd(avg, k)))); }
    if (guess != null) { svg.appendChild(svgEl('path', { d: 'M' + x(guess) + ' ' + (ly + 2) + ' l-12 24 h24 z', fill: '#e8891d' })); svg.appendChild(svgEl('text', { x: x(guess), y: ly + 60, 'text-anchor': 'middle', 'font-size': 18, fill: '#e8891d' }, '予想 ' + fmt(guess))); }
    host.querySelector('#lmsg').innerHTML = guess == null ? '' : revealed ? '<div class="msg ' + (Math.abs(guess - avg) < (hi - lo) * 0.03 ? 'ok' : 'info') + '">' + (Math.abs(guess - avg) < (hi - lo) * 0.03 ? 'とても近い！' : guess < avg ? 'ほんとうの平均は、予想より少し大きいよ。' : 'ほんとうの平均は、予想より少し小さいよ。') + ' 平均はいちばん大きい数といちばん小さい数の間にあるよ。</div>' :
      '<div class="cards"><button class="sm" id="lok">ここだと思う</button></div>';
    const b = host.querySelector('#lok'); if (b) b.addEventListener('click', () => { revealed = true; draw(); });
  }
  svg.addEventListener('pointerdown', ev => { if (revealed) return; const p = ptPos(svg, ev); guess = rnd(Math.max(lo, Math.min(hi, lo + (p.x - left) / (right - left) * (hi - lo))), k); draw(); ev.preventDefault(); });
  draw();
};

// ---- テープ図 ----
WIDGETS['r-tape'] = function (host, ctx) {
  const t = ctx.tape, n = t.n, shown = Math.min(n, 8), W = 760, H = 170, left = 20, right = W - 20, y = 40, h = 60;
  host.innerHTML = '<div class="note">' + (t.dir === 'total' ? '平均が ' + n + ' 個分ならんでいると考えよう。全部の長さが合計。' : '合計を ' + n + ' 個に等しく分けたうちの1個分が平均。') + '</div>';
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'w' }); host.appendChild(svg);
  const segW = (right - left) / shown;
  for (let i = 0; i < shown; i++) {
    const dots = n > shown && i === shown - 2;
    svg.appendChild(svgEl('rect', { x: left + segW * i, y, width: segW, height: h, fill: dots ? '#fff' : '#f7c948', stroke: '#333', 'stroke-width': 2 }));
    svg.appendChild(svgEl('text', { x: left + segW * i + segW / 2, y: y + h / 2 + 7, 'text-anchor': 'middle', 'font-size': 20 }, dots ? '…' : (t.dir === 'total' ? fmt(t.avg) : '？')));
  }
  svg.appendChild(svgEl('path', { d: 'M' + left + ' ' + (y + h + 10) + ' v12 H' + right + ' v-12', fill: 'none', stroke: '#3a6fd8', 'stroke-width': 3 }));
  svg.appendChild(svgEl('text', { x: W / 2, y: y + h + 48, 'text-anchor': 'middle', 'font-size': 22, fill: '#3a6fd8', 'font-weight': 'bold' }, t.dir === 'total' ? '合計 ＝ ？（' + fmt(t.avg) + '×' + n + '）' : '合計 ' + fmt(t.total) + ctx.unit + '（？×' + n + '）'));
  svg.appendChild(svgEl('text', { x: W / 2, y: y - 14, 'text-anchor': 'middle', 'font-size': 20 }, n + ' 個分'));
};

// =====================================================================
// 起動
// =====================================================================
window.addEventListener('error', e => { const el = document.createElement('div'); el.className = 'msg'; el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999'; el.textContent = 'エラー：' + e.message; document.body.appendChild(el); });
renderStart();
</script>
